packages:
  - packages/*

# Dependency Resolution
overrides:
  '@langchain/core': ^1.1.44
  n8n-workflow: 2.47.2
  # @tiptap/vue-3 requires exactly matching @tiptap/core and @tiptap/pm versions
  '@tiptap/vue-3>@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/vue-3>@tiptap/extension-floating-menu': 3.30.5

minimumReleaseAge: 1440

# Sheet-JS xlsx package can only be downloaded from their own CDN
blockExoticSubdeps: false

# Peer Dependency Settings
peerDependencyRules:
  allowedVersions:
    '@browserbasehq/stagehand>openai': '6'
    '@getzep/zep-cloud>langchain': '1'
    '@langchain/community>@azure/search-documents': '12'
    '@langchain/community>@getzep/zep-js': '0.9'
    '@langchain/community>@huggingface/inference': '4'
    '@langchain/community>@xata.io/client': '0.28'
    '@langchain/community>cheerio': '1'
    '@langchain/community>d3-dsv': '2'
    '@langchain/community>ignore': '5'
    '@n8n/eslint-plugin-community-nodes>eslint': '9'

# Build Settings
verifyDepsBeforeRun: error

allowBuilds:
  '@confluentinc/kafka-javascript': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': false
  '@sentry/node-native-stacktrace': false
  agent-browser: false
  cpu-features: false
  esbuild: true
  eslint-plugin-n8n-nodes-base: false
  isolated-vm: true
  msgpackr-extract: false
  oracledb: false
  oxc-resolver: false
  protobufjs: false
  sqlite3: true
  ssh2: false
  unrs-resolver: false
  vue-demi: false

# Other Settings
updateNotifier: false

patchedDependencies:
  '@conventional-changelog/template': patches/@conventional-changelog__template.patch
  conventional-changelog-conventionalcommits: patches/conventional-changelog-conventionalcommits.patch
  n8n: patches/n8n.patch
