packages:
  - packages/*

overrides:
  '@langchain/core': ^1.1.44

patchedDependencies:
  '@conventional-changelog/template': patches/@conventional-changelog__template.patch
  conventional-changelog-conventionalcommits@9.3.1: patches/conventional-changelog-conventionalcommits@9.3.1.patch
  conventional-changelog-conventionalcommits@10.2.1: patches/conventional-changelog-conventionalcommits@10.2.1.patch
  n8n-core: patches/n8n-core.patch
  n8n: patches/n8n.patch

# Sheet-JS xlsx package can only be downloaded from their own CDN
blockExoticSubdeps: false

verifyDepsBeforeRun: error

ignoredBuiltDependencies:
  - oxc-resolver

allowBuilds:
  '@confluentinc/kafka-javascript': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@sentry/node-cpu-profiler': true
  '@sentry/node-native-stacktrace': true
  agent-browser: true
  cpu-features: true
  esbuild: true
  eslint-plugin-n8n-nodes-base: true
  isolated-vm: true
  msgpackr-extract: true
  oracledb: true
  protobufjs: true
  sqlite3: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAge: 0
